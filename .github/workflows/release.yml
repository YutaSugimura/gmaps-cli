name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: 'Tag name to use for a dry-run build (no Release will be created)'
        required: false
        default: 'v0.0.0-dev'

# ── Required repository secrets ──────────────────────────────────────────
# Code signing (Developer ID Application):
#   MACOS_CERTIFICATE          base64 of the exported .p12 (cert + private key)
#   MACOS_CERTIFICATE_PWD      password protecting that .p12
#   KEYCHAIN_PASSWORD          any random string; for the ephemeral keychain
# Notarization (Apple notary service):
#   APPLE_ID                   Apple ID email
#   APPLE_TEAM_ID              10-char Developer Team ID
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password (appleid.apple.com)
# See scripts/build-signed.sh for the local equivalent of this flow.
# ─────────────────────────────────────────────────────────────────────────

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  KEYCHAIN_PATH: "${{ runner.temp }}/app-signing.keychain-db"

jobs:
  build:
    name: Build signed .app bundle
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.dry_run_tag }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Verify Cargo.toml version matches tag
        if: github.event_name == 'push'
        run: |
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | awk -F'"' '{print $2}')"
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "Versions match: $CARGO_VERSION"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          # Create an ephemeral keychain so the signing key never lands in the
          # runner's login keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign
          # Let codesign use the key non-interactively.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend our keychain to the search list, keeping the existing ones
          # (so Apple's intermediate certs in the system keychain stay visible).
          EXISTING=$(security list-keychains -d user | sed -e 's/[\" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          rm -f "$CERT_PATH"
          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/build-signed.sh

      - name: Locate artifact and compute checksum
        id: package
        run: |
          ZIP_NAME="$(ls gmaps-*-macos-*.app.zip)"
          SHA256="$(shasum -a 256 "$ZIP_NAME" | awk '{print $1}')"
          {
            echo "zip_name=${ZIP_NAME}"
            echo "sha256=${SHA256}"
          } >> "$GITHUB_OUTPUT"
          echo "Built: ${ZIP_NAME}"
          echo "SHA256: ${SHA256}"

      - name: Verify zip, signature, and notarization
        run: |
          unzip -t "${{ steps.package.outputs.zip_name }}" > /dev/null
          APP="target/release/bundle/osx/gmaps.app"
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=4 "$APP"

      - name: Create GitHub Release (tag push only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `${{ steps.package.outputs.zip_name }}` below.
            2. Unzip and move `gmaps.app` to `/Applications/`.
               (Signed with a Developer ID and notarized by Apple, so it
               launches without any Gatekeeper bypass. The bundle is a CLI
               helper, so no window will appear.)
            3. Symlink the binary onto your PATH:
               ```
               mkdir -p ~/.local/bin
               ln -sf /Applications/gmaps.app/Contents/MacOS/gmaps ~/.local/bin/gmaps
               # Ensure ~/.local/bin is on PATH (e.g., add to ~/.zshrc):
               # export PATH="$HOME/.local/bin:$PATH"
               ```
            4. Verify with `gmaps --version`.
            5. The first `gmaps -H` invocation will trigger the
               Location Services authorization dialog.

            See [INSTALL.md](https://github.com/YutaSugimura/gmaps-cli/blob/main/INSTALL.md)
            for full instructions, SHA256 verification, and Intel Mac
            (source build) notes.

            ### SHA256

            ```
            ${{ steps.package.outputs.sha256 }}  ${{ steps.package.outputs.zip_name }}
            ```

      - name: Upload artifact (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 7

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
