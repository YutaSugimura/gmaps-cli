name: Audit

# cargo audit only reads Cargo.lock, so this runs on cheap Linux runners.
# Weekly schedule catches advisories published against an unchanged lock
# file; the push/PR paths filter re-checks whenever dependencies change.
on:
  schedule:
    - cron: '30 2 * * 1' # Mondays 02:30 UTC
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/audit.yml'

permissions:
  contents: read
  # Scheduled runs open an issue when a new advisory matches Cargo.lock.
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit Cargo.lock against the RustSec advisory DB
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
